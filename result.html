<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Deteksi</title>
</head>
<body>
    <h1>Hasil Deteksi Diabetes</h1>
    <div id="userData"></div>
    <div id="sensorData"></div>
    <div id="result"></div>
    <button id="detectDiabetes">Deteksi Diabetes</button>

    <script>
        const userData = JSON.parse(sessionStorage.getItem('userData'));
        const sensorData = JSON.parse(sessionStorage.getItem('sensorData'));

        document.getElementById('userData').innerHTML = `
            <h2>Data Pengguna</h2>
            <p>Nama: ${userData.name}</p>
            <p>Usia: ${userData.age}</p>
            <p>Jenis Kelamin: ${userData.gender}</p>
        `;

        document.getElementById('sensorData').innerHTML = `
            <h2>Data Sensor</h2>
            <p>Kadar Glukosa: ${sensorData.glucose} mg/dL</p>
            <p>Detak Jantung: ${sensorData.heartRate} bpm</p>
            <p>SpO2: ${sensorData.spo2} %</p>
        `;

        document.getElementById('detectDiabetes').onclick = function() {
        const glucose = sensorData.glucose;
        const heartRate = sensorData.heartRate;
        const spo2 = sensorData.spo2;

        fetch('/predict', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ glucose, heart_rate: heartRate, spo2 })
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('result').innerHTML = `
                <h2>Diagnosis</h2>
                <p>${data.diagnosis}</p>
                <p>Saran: ${data.advice}</p>
            `;
        })
        .catch(error => console.error('Error:', error));
    };
    </script>
</body>
</html>
